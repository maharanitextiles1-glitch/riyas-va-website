<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login · Riyas V. A.</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f2eb;color:#171717;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e5dfd3;border-radius:22px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.08)}h1{font-family:Georgia,serif;margin:0 0 8px;font-size:30px}.muted{color:#777;margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px;text-transform:uppercase;letter-spacing:.08em}input{width:100%;padding:13px 14px;border:1px solid #d9d4c9;border-radius:10px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#171717;color:#fff;font-weight:700;cursor:pointer}.alert{padding:11px;border-radius:9px;background:#fff0f0;color:#9d2626;margin-bottom:14px}</style></head>
<body><form class="card" method="post"><h1>Riyas V. A. CMS</h1><p class="muted">Website content administration</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}<label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></body></html>
